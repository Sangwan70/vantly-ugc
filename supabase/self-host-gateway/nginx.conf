# Minimal Supabase-style gateway for the self-host docker-compose stack.
#
# supabase-js's SupabaseClient (used both by the browser and by every
# server-side service here) unconditionally builds its sub-client URLs by
# appending a fixed suffix to whatever base URL it's given:
#   ${url}/auth/v1/...      (GoTrue)
#   ${url}/rest/v1/...      (PostgREST)
#   ${url}/storage/v1/...   (storage-api)
# None of those three services understand that prefix themselves — PostgREST
# has no config option to be mounted under a path (confirmed against its own
# docs), and the same is true of GoTrue and storage-api. The hosted product
# and the official self-host guide both solve this with Kong in front of all
# three; this does the same job with a single small nginx container instead,
# so one env var (SUPABASE_URL / NEXT_PUBLIC_SUPABASE_URL) can point at ONE
# origin for all three APIs.
#
# Without this, EVERY supabase-js call in this codebase — email OTP login,
# every browser-side `.from()` query, every server-side `createClient()` in
# api-v2 / the workers / the web app's route handlers — targets a path none
# of these services recognize, and fails (a hard connection/CORS-shaped
# failure for the browser, a plain 404 server-side).
#
# CORS: every supabase-js request (browser-side Auth calls in particular)
# sends `apikey` and `Authorization` headers on top of `Content-Type`. GoTrue
# has its own built-in CORS handling, but its allowed-headers list does NOT
# include `apikey` — so the browser's preflight OPTIONS for that header gets
# rejected and the real request never fires, surfacing in the browser purely
# as a generic "Failed to fetch" (the request never shows as a 4xx/5xx; it's
# blocked before it's sent). Real Supabase avoids this because Kong's CORS
# plugin sits in front of GoTrue with no header restrictions at all. We do
# the same job here: answer preflight directly at the gateway, and strip any
# CORS headers GoTrue/PostgREST/storage-api add themselves so the browser
# never sees two conflicting values for the same header.
#
# IMPORTANT nginx gotcha (cost real debugging time, so noted here): the
# OPTIONS check below MUST come BEFORE any `rewrite ... break;` in the same
# location. `break` stops ALL further ngx_http_rewrite_module directive
# processing for that request — and `if` is itself a rewrite-module
# construct. An `if` placed after a `break`'d rewrite is silently never
# evaluated: nginx falls through to proxy_pass every time, which is exactly
# how this looked before the fix (200/204 responses that were actually
# GoTrue's own CORS handling passing through untouched, missing
# Access-Control-Allow-Headers because GoTrue's own allow-list excludes
# `apikey`).

worker_processes 1;
events {
  worker_connections 1024;
}

http {
  # Uses Docker's embedded DNS (127.0.0.11) so a backend container can
  # restart/get a new IP without nginx caching the old one at startup.
  resolver 127.0.0.11 valid=10s;

  # Reflects the request's own Origin rather than a fixed list, so any
  # localhost port (or, in production, your real APP_PUBLIC_URL origin) is
  # allowed without hand-maintaining a list — matching Kong's default
  # (unconfigured) cors plugin behavior. Falls back to "*" only when there's
  # no Origin header at all (e.g. a plain curl test, or a same-origin caller
  # that doesn't send one) — that path never has credentials to conflict with
  # the wildcard, so it stays spec-valid.
  map $http_origin $cors_origin {
    default $http_origin;
    ""      "*";
  }

  server {
    listen 3000;

    # GoTrue serves its routes at the root (e.g. /token, /otp, /verify,
    # /admin/*) — strip the /auth/v1 prefix before forwarding.
    location /auth/v1/ {
      # Hide GoTrue's own (more restrictive) CORS headers so ours are the
      # only ones the browser sees — two values for the same header is
      # itself a CORS failure.
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;
      proxy_hide_header Vary;

      # MUST come before the rewrite/break below - see the file header note.
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' $http_access_control_request_headers always;
        add_header 'Access-Control-Max-Age' 86400 always;
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' $cors_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      set $upstream_auth http://auth:9999;
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass $upstream_auth;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PostgREST serves tables/views/rpcs at the root (e.g. /profiles,
    # /rpc/some_function) — strip the /rest/v1 prefix before forwarding.
    location /rest/v1/ {
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;
      proxy_hide_header Vary;

      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' $http_access_control_request_headers always;
        add_header 'Access-Control-Max-Age' 86400 always;
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' $cors_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      set $upstream_rest http://rest:3000;
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass $upstream_rest;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # storage-api serves its routes at the root the same way — strip the
    # /storage/v1 prefix before forwarding.
    location /storage/v1/ {
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Expose-Headers;
      proxy_hide_header Access-Control-Max-Age;
      proxy_hide_header Vary;

      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' $http_access_control_request_headers always;
        add_header 'Access-Control-Max-Age' 86400 always;
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' $cors_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      set $upstream_storage http://storage:5000;
      rewrite ^/storage/v1/(.*)$ /$1 break;
      proxy_pass $upstream_storage;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 512M;
    }

    location / {
      return 404 '{"error":"not_found","message":"This gateway only serves /auth/v1, /rest/v1, and /storage/v1."}';
      default_type application/json;
    }
  }
}

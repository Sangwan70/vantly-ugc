# vantly-ugc — self-host stack.
#
#   cp .env.example .env.local        # local dev — fill in provider keys
#   docker compose --env-file .env.local up
#
#   cp .env.example .env.prod         # production — fill in real secrets
#   docker compose --env-file .env.prod up -d
#
# env_file: ["${ENV_FILE:-.env.local}"] below reads ENV_FILE from whichever
# file --env-file points at, so the same compose file works for both. Each
# env file must set ENV_FILE to its own name (already done in .env.example).
#
# This bundles OPEN equivalents of every managed service the hosted product
# uses, so you are not tied to our vendors:
#
#   Supabase (managed) -> postgres + auth (GoTrue) + rest (PostgREST)  [this file]
#   Temporal Cloud     -> temporal                                      [this file]
#   Cloudflare R2      -> minio (S3-compatible)                         [this file]
#
# Billing is OFF here (BILLING_MODE=disabled): you bring your own provider keys
# and generate freely against them, with no credit ledger and no Stripe.
#
# NOTE ON SUPABASE: the app needs more than a bare Postgres — it uses Supabase's
# Auth (GoTrue) and PostgREST APIs. Running plain postgres alone is why an
# earlier version of this file could not actually boot the app. The services
# below provide those APIs; SUPABASE_URL points at the local `rest` gateway.

name: vantly-ugc

x-supabase-jwt: &supabase-jwt
  # Local-only demo keys. They are signed with JWT_SECRET below and are safe to
  # publish BECAUSE they only ever authenticate against your own local stack.
  # Generate your own for anything internet-facing: https://supabase.com/docs/guides/self-hosting
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env.local or .env.prod (see .env.example)}

# The anon / service_role JWTs matching the demo JWT_SECRET above. api-v2 and
# the workers REQUIRE these at boot, so without defaults here `docker compose up`
# died instantly on a fresh clone and the self-host path was unusable. Override
# both (and JWT_SECRET) for anything reachable from the internet.
x-supabase-keys: &supabase-keys
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in your .env.local or .env.prod (see .env.example)}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in your .env.local or .env.prod (see .env.example)}

# Shared secrets the services use to authenticate to EACH OTHER. They are
# required at boot and must be IDENTICAL across services, so they get local
# defaults here — otherwise a fresh clone dies with "INTERNAL_API_SECRET is
# required". Nothing here is reachable from outside the compose network; set
# real values via .env.prod for any deployment that is.
x-internal-secrets: &internal-secrets
  WORKER_SECRET: ${WORKER_SECRET:?Set WORKER_SECRET in your .env.local or .env.prod (see .env.example)}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET in your .env.local or .env.prod (see .env.example)}
  CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in your .env.local or .env.prod (see .env.example)}
  SUBTITLE_WORKER_SECRET: ${SUBTITLE_WORKER_SECRET:?Set SUBTITLE_WORKER_SECRET in your .env.local or .env.prod (see .env.example)}
  VNEXT_PRIMITIVE_WORKER_SECRET: ${VNEXT_PRIMITIVE_WORKER_SECRET:?Set VNEXT_PRIMITIVE_WORKER_SECRET in your .env.local or .env.prod (see .env.example)}
  BRAND_EXTRACTOR_SECRET: ${BRAND_EXTRACTOR_SECRET:?Set BRAND_EXTRACTOR_SECRET in your .env.local or .env.prod (see .env.example)}

services:
  # ── Data plane ──────────────────────────────────────────────────────────
  postgres:
    image: supabase/postgres:15.8.1.020
    environment:
      # Deliberately NOT setting POSTGRES_USER. This image bootstraps itself as
      # supabase_admin and creates the anon/authenticated/service_role roles;
      # overriding the superuser makes its own migrate.sh fail with
      # 'role "supabase_admin" does not exist' and no roles ever get created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env.local or .env.prod (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    # Host port overridable via POSTGRES_PORT (default 5433 - 5432 is the
    # single most commonly already-taken port on a dev machine, e.g. by
    # another local Postgres-based stack).
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # NOTE: do NOT mount app migrations at /docker-entrypoint-initdb.d. That
      # path already contains the Supabase image's own bootstrap (roles, the
      # auth/storage/extensions schemas), and mounting over it silently deletes
      # them — every migration then failed with 'schema "auth" does not exist'.
      # Migrations are applied by the `migrate` service below, after GoTrue has
      # created auth.users.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The image creates the anon/authenticated/service_role/authenticator roles but
  # leaves them password-less, so GoTrue and PostgREST both died with
  # "password authentication failed". This sets their passwords once, before
  # anything tries to connect.
  db-init:
    image: supabase/postgres:15.8.1.020
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # supabase_admin, not postgres: `authenticator` is a reserved role in this
      # image and only a superuser may alter it ("is a reserved role, only
      # superusers can modify it").
      PGURI: postgres://supabase_admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env.local or .env.prod (see .env.example)}@postgres:5432/${POSTGRES_DB:-postgres}
      PGPASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env.local or .env.prod (see .env.example)}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        for role in authenticator supabase_auth_admin supabase_storage_admin; do
          psql -v ON_ERROR_STOP=1 "$$PGURI" \
            -c "ALTER ROLE $$role WITH LOGIN PASSWORD '$$PGPASS'"
        done
        echo "ROLE PASSWORDS SET"
    restart: "no"

  # Supabase Auth. The app verifies user JWTs and runs the MCP OAuth flow
  # against this.
  auth:
    image: supabase/gotrue:v2.196.0
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      <<: *supabase-jwt
      # GoTrue reads its own GOTRUE_-prefixed name, not JWT_SECRET. Without this
      # it exits immediately: "required key GOTRUE_JWT_SECRET missing value".
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env.local or .env.prod (see .env.example)}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      # Public base URL (scheme+host only). GoTrue's mailer does NOT append
      # any path segments already present here — it parses this down to
      # scheme+host and rebuilds the path itself from the
      # GOTRUE_MAILER_URLPATHS_* vars below (confirmed: setting this to
      # ".../auth/v1" had zero effect on the emailed link, which still came
      # out as https://auth.vantly-ugc.com/verify with no /auth/v1). Keep
      # this as a clean base — SUPABASE_PUBLIC_URL, not the internal
      # http://gateway:3000 address used for server-to-server calls
      # elsewhere.
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      # GoTrue is only reachable externally through the gateway's /auth/v1/
      # prefix, but GoTrue's own OTP/magic-link/invite/recovery emails
      # default to "{API_EXTERNAL_URL}/verify" (no prefix) — a 404 at the
      # gateway ("This gateway only serves /auth/v1, /rest/v1, and
      # /storage/v1"). These four MAILER_URLPATHS vars override the path
      # GoTrue builds into each email type so it lands on the gateway route
      # that actually exists.
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_INVITE: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_RECOVERY: "/auth/v1/verify"
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: "/auth/v1/verify"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env.local or .env.prod (see .env.example)}@postgres:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${APP_PUBLIC_URL:-http://localhost:3005}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # SMTP relay for the OTP emails GoTrue sends on sign-in. Without these,
      # GoTrue has no way to deliver mail and OTP requests silently fail to
      # send. Defaults are blank/Postmark's standard port so a fresh install
      # without email configured still starts (auth just won't be able to
      # send mail until these are set in .env.local / .env.prod).
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-Vantly UGC}
      # Must be a Postmark-verified Sender Signature or verified sending
      # domain - Postmark rejects mail from any other From address.
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-no-reply@vantly-ugc.com}
      # "Continue with Google" on the login modal (apps/web/components/login-modal.tsx
      # already calls supabase.auth.signInWithOAuth({ provider: 'google' })) — this is
      # the only piece that was missing. Create the OAuth client in Google Cloud
      # Console and set GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID/_SECRET below; add
      # {SUPABASE_URL}/auth/v1/callback (the PUBLIC url your gateway service is
      # reachable at, not the internal http://gateway:3000) as an Authorized
      # redirect URI on that OAuth client.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-}
      # OAuth 2.1 authorization server (api-v2/src/mcp-oauth.ts) — lets
      # connector clients (Claude Desktop, Claude.ai, Cursor, ...) register
      # themselves against api.vantly-ugc.com/mcp and sign in via browser
      # instead of a pasted API key. Requires GoTrue >= v2.180.0 (bumped
      # above from v2.177.0, which predates this feature entirely and made
      # every /register call fail with no error surfaced to the user).
      # ALLOW_DYNAMIC_REGISTRATION is what lets a connector self-register
      # without an admin pre-creating the client; AUTHORIZATION_PATH is a
      # path (not a full URL) combined with GOTRUE_SITE_URL above, and must
      # match the consent screen already built at
      # apps/web/app/(auth)/oauth/consent/page.tsx.
      GOTRUE_OAUTH_SERVER_ENABLED: "true"
      GOTRUE_OAUTH_SERVER_ALLOW_DYNAMIC_REGISTRATION: "true"
      GOTRUE_OAUTH_SERVER_AUTHORIZATION_PATH: "/oauth/consent"
    ports: ["9999:9999"]

  # One-shot schema bootstrap. Waits for GoTrue to create auth.users (many
  # migrations reference it), then applies every migration in filename order and
  # exits. App services wait for this to succeed, so they never see a half-built
  # schema. Re-running is safe on an existing volume only if your migrations are
  # idempotent; for a clean slate use `docker compose down -v`.
  migrate:
    image: supabase/postgres:15.8.1.020
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_started }
      storage: { condition: service_started }
    volumes:
      - ./supabase/migrations:/migrations:ro
    environment:
      PGURI: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env.local or .env.prod (see .env.example)}@postgres:5432/${POSTGRES_DB:-postgres}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "waiting for GoTrue to create auth.users..."
        for i in $$(seq 1 60); do
          if psql "$$PGURI" -tAc "select 1 from auth.users limit 1" >/dev/null 2>&1; then
            echo "auth.users is present"; break
          fi
          sleep 3
        done
        echo "waiting for storage-api to migrate the storage schema..."
        for i in $$(seq 1 60); do
          if psql "$$PGURI" -tAc \
            "select 1 from information_schema.columns where table_schema='storage' and table_name='buckets' and column_name='public'" \
            | grep -q 1; then
            echo "storage schema is ready"; break
          fi
          sleep 3
        done
        # Ledger of what has already run. Without it a second `docker compose up`
        # re-applied all 100 migrations against an existing database, failed, and
        # took every app service down with it (they wait on this job succeeding).
        psql -v ON_ERROR_STOP=1 "$$PGURI" -c \
          "CREATE TABLE IF NOT EXISTS public._selfhost_migrations (
             name text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())"
        # Only timestamped migrations. Files starting with '_' are test fixtures
        # (e.g. _test_deduct_credits_idempotent.sql), which assert against seeded
        # data and fail on an empty database — they are not schema migrations.
        for f in /migrations/[0-9]*.sql; do
          n=$$(basename "$$f")
          if psql -tAc "select 1 from public._selfhost_migrations where name='$$n'" "$$PGURI" | grep -q 1; then
            continue
          fi
          echo "applying $$n"
          psql -v ON_ERROR_STOP=1 "$$PGURI" -f "$$f"
          psql -v ON_ERROR_STOP=1 "$$PGURI" -c \
            "INSERT INTO public._selfhost_migrations (name) VALUES ('$$n')"
        done
        echo "ALL MIGRATIONS APPLIED"
    restart: "no"

  # PostgREST — the REST surface the supabase-js client talks to.
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      <<: *supabase-jwt
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env.local or .env.prod (see .env.example)}@postgres:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env.local or .env.prod (see .env.example)}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    # No ports: published here any more — nothing outside the compose network
    # talks to bare PostgREST directly. The `gateway` service below is what's
    # published on 8000; it proxies /rest/v1/* here (see its nginx.conf).

  # Minimal Kong-equivalent: supabase-js (browser AND every server-side
  # service here) always appends /auth/v1, /rest/v1, /storage/v1 to whatever
  # base URL it's given — none of GoTrue/PostgREST/storage-api understand
  # that prefix on their own. This one small nginx container strips it and
  # forwards to the right backend, so ONE URL (this container's :3000, or
  # localhost:8000 from the browser) works for all three. See
  # supabase/self-host-gateway/nginx.conf for the actual routes/rationale.
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      auth: { condition: service_started }
      rest: { condition: service_started }
      storage: { condition: service_started }
    volumes:
      - ./supabase/self-host-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8000:3000"]

  # Supabase Storage. Three migrations create buckets and RLS policies on
  # storage.objects, and the bare image ships only a stub storage schema — so
  # without this service they failed with 'column "public" of relation "buckets"
  # does not exist'. storage-api migrates that schema on boot. Its own object
  # bytes live in MinIO, same as everything else here.
  storage:
    image: supabase/storage-api:v1.11.13
    depends_on:
      db-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    environment:
      <<: [*supabase-keys, *internal-secrets]
      ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in your .env.local or .env.prod (see .env.example)}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in your .env.local or .env.prod (see .env.example)}
      PGRST_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env.local or .env.prod (see .env.example)}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env.local or .env.prod (see .env.example)}@postgres:5432/${POSTGRES_DB:-postgres}
      POSTGREST_URL: http://rest:3000
      TENANT_ID: selfhost
      REGION: us-east-1
      FILE_SIZE_LIMIT: "524288000"
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${R2_BUCKET:-vantly-ugc}
      GLOBAL_S3_ENDPOINT: http://minio:9000
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      GLOBAL_S3_PROTOCOL: http
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      ENABLE_IMAGE_TRANSFORMATION: "false"
    # Deliberately not published. Nothing outside the compose network talks to
    # storage-api directly, and port 5000 is taken by AirPlay Receiver on macOS,
    # which made `docker compose up` fail with "address already in use".

  # ── Object storage (stands in for Cloudflare R2) ────────────────────────
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${R2_ACCESS_KEY_ID:-minioadmin} ${R2_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb -p local/${R2_BUCKET:-vantly-ugc} &&
      mc anonymous set download local/${R2_BUCKET:-vantly-ugc} || true"

  # ── Durable orchestration (vNext composed workflows) ────────────────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env.local or .env.prod (see .env.example)}
      POSTGRES_SEEDS: postgres
    # Host port overridable via TEMPORAL_PORT (default 7234, since 7233 is
    # Temporal's own hardcoded default and easily taken by another local
    # Temporal server).
    ports: ["${TEMPORAL_PORT:-7234}:7233"]

  # ── Application services ────────────────────────────────────────────────
  # Each has its own Dockerfile and deploys independently to any container host
  # (Railway, Fly, Render, ECS, a plain VPS).
  #
  # The S3_* vars are what make MinIO work: without them the storage clients
  # default to Cloudflare R2's endpoint and the bundled MinIO sits unused.
  # S3_FORCE_PATH_STYLE is required because MinIO serves /bucket/key rather than
  # the virtual-host style R2 uses.

  api-v2:
    build:
      context: .
      dockerfile: services/api-v2/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      gateway: { condition: service_started }
    env_file: ["${ENV_FILE:-.env.local}"]
    environment:
      <<: [*supabase-keys, *internal-secrets]
      PORT: 3001
      BILLING_MODE: disabled
      SUPABASE_URL: http://gateway:3000
      TEMPORAL_ADDRESS: temporal:7233
      # The bundled Temporal auto-setup creates exactly one namespace, "default".
      # The worker treats this as required and exits without it.
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TLS: "false"
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      R2_BUCKET: ${R2_BUCKET:-vantly-ugc}
      R2_PUBLIC_URL: http://localhost:9000/${R2_BUCKET:-vantly-ugc}
    ports: ["3001:3001"]

  # The dashboard. There is no public marketing site in this distribution —
  # `/` redirects to /dashboard, and robots.txt disallows everything, because a
  # self-hosted instance has no business being indexed.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next bakes the image-optimizer allowlist at build time. MinIO serves
        # generated media here, so it must be allowed or every <Image> 400s.
        NEXT_PUBLIC_IMAGE_HOSTS: localhost
    depends_on: [api-v2, gateway]
    env_file: ["${ENV_FILE:-.env.local}"]
    environment:
      <<: [*supabase-keys, *internal-secrets]
      PORT: 3000
      # Browser-facing: these are read at RUNTIME by the root layout, so one
      # image serves any environment.
      # The Next middleware builds a Supabase client on EVERY request and needs
      # the browser-side names specifically. Without the anon key here, every
      # route 500s with "Your project's URL and Key are required".
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in your .env.local or .env.prod (see .env.example)}
      # Bugfix: these two used to be hardcoded literals here, which silently
      # discarded whatever NEXT_PUBLIC_BACKEND_URL/NEXT_PUBLIC_MCP_URL the
      # active env file (.env.local vs .env.prod, selected by ENV_FILE) set —
      # so a production deploy still baked "localhost:3001" into the browser
      # bundle. Now they resolve from the env file, with the local-dev value
      # as the fallback default only.
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
      NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-http://localhost:3001/mcp}
      # Server-side (Next.js API routes running inside this container) calls
      # to api-v2 — gallery, character sheets, storyboards, skills, schedules,
      # video generation/status, the in-app agent, etc. Without this, every
      # one of those ~28 proxy routes falls back to the production placeholder
      # domain and 502s with "upstream_unreachable: fetch failed" (this is why
      # generated images/screenshots/gallery items failed to load — the web
      # container couldn't reach api-v2 at all). NEXT_PUBLIC_BACKEND_URL above
      # is deliberately different: that one is read by the BROWSER, so it
      # must stay the public localhost address, not this internal hostname.
      API_V2_URL: http://api-v2:3001
      SUPABASE_URL: http://gateway:3000
      # Same value as NEXT_PUBLIC_SUPABASE_URL above, but read server-side by
      # middleware.ts to build the CSP connect-src allowlist. Can't reuse the
      # NEXT_PUBLIC_ name for that: Next.js inlines every NEXT_PUBLIC_* env
      # var reference at build time (see middleware.ts's comment), which
      # would bake in an empty/wrong value forever. This plain var is read at
      # container start instead, so one image still serves any environment.
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      # Onboarding's "extract my brand from this URL" step - proxied to the
      # standalone brand-extractor service below. BRAND_EXTRACTOR_SECRET
      # comes from the internal-secrets anchor merged in above.
      BRAND_EXTRACTOR_URL: http://brand-extractor:3000
    # Port 3000 is the most contested port on any dev machine, so the default
    # here is already bumped to 3005. Override with WEB_PORT=... in .env.local
    # (or .env.prod) rather than editing this file.
    ports: ["${WEB_PORT:-3005}:3000"]

  # Standalone Playwright + Chromium service that screenshots a product URL
  # and extracts brand colors/logo/name for the onboarding flow. Kept out of
  # the web image so its Chromium install doesn't bloat that build. Claude
  # vision refinement is optional - it just falls back to non-AI defaults
  # when ANTHROPIC_API_KEY is blank (see src/ai-vision.js).
  brand-extractor:
    build:
      context: .
      dockerfile: services/brand-extractor/Dockerfile
    env_file: ["${ENV_FILE:-.env.local}"]
    environment:
      PORT: 3000
      # brand-extractor's own server.js checks the generic WORKER_SECRET
      # name; map it to the same value web sends as BRAND_EXTRACTOR_SECRET
      # so the two sides actually agree.
      WORKER_SECRET: ${BRAND_EXTRACTOR_SECRET:?Set BRAND_EXTRACTOR_SECRET in your .env.local or .env.prod (see .env.example)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # MODEL_PROVIDER=openrouter switches ai-vision.js to OpenRouter's
      # Anthropic-compatible endpoint using OPENROUTER_API_KEY instead.
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      R2_BUCKET: ${R2_BUCKET:-vantly-ugc}
      # Bugfix: this used to be a hardcoded "http://localhost:9000/..."
      # literal, which silently discarded whatever real R2_PUBLIC_URL the
      # active env file set. brand-extractor's own r2.js (unlike
      # media-worker-v2/primitive-worker-vnext's) has NO S3_ENDPOINT/MinIO
      # support at all — it always uploads straight to real Cloudflare R2 —
      # so forcing the MinIO-shaped localhost URL here made every screenshot
      # and AI-cropped logo it uploads resolve to a URL nothing was ever
      # written to (uploads succeeded against real R2; only the returned
      # public URL was wrong). Now it reads the real value from the env file,
      # falling back to r2.js's own placeholder default only when unset.
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://pub-16e2ed8f6be84691845e91436920ce0a.r2.dev}
    # Host port overridable via BRAND_EXTRACTOR_PORT (default 3012);
    # exposed mainly for direct debugging, web reaches it over the
    # compose network at http://brand-extractor:3000.
    ports: ["${BRAND_EXTRACTOR_PORT:-3012}:3000"]

  primitive-worker-vnext:
    build:
      context: .
      dockerfile: services/primitive-worker-vnext/Dockerfile
    depends_on: [api-v2, temporal, gateway]
    env_file: ["${ENV_FILE:-.env.local}"]
    environment:
      <<: [*supabase-keys, *internal-secrets]
      BILLING_MODE: disabled
      SUPABASE_URL: http://gateway:3000
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TLS: "false"
      API_V2_URL: http://api-v2:3001
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      R2_BUCKET: ${R2_BUCKET:-vantly-ugc}
      R2_PUBLIC_URL: http://localhost:9000/${R2_BUCKET:-vantly-ugc}

  media-worker-v2:
    build:
      context: .
      dockerfile: services/media-worker-v2/Dockerfile
    depends_on: [api-v2, gateway]
    env_file: ["${ENV_FILE:-.env.local}"]
    environment:
      <<: [*supabase-keys, *internal-secrets]
      PORT: 3000
      BILLING_MODE: disabled
      SUPABASE_URL: http://gateway:3000
      API_V2_URL: http://api-v2:3001
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      R2_BUCKET: ${R2_BUCKET:-vantly-ugc}
      R2_PUBLIC_URL: http://localhost:9000/${R2_BUCKET:-vantly-ugc}
    # Host port overridable via MEDIA_WORKER_PORT (default 3010).
    ports: ["${MEDIA_WORKER_PORT:-3010}:3000"]

  subtitle-worker:
    build:
      context: .
      dockerfile: services/subtitle-worker/Dockerfile
    depends_on: [api-v2, gateway]
    env_file: ["${ENV_FILE:-.env.local}"]
    environment:
      <<: [*supabase-keys, *internal-secrets]
      PORT: 3000
      SUPABASE_URL: http://gateway:3000
      API_V2_URL: http://api-v2:3001
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-minioadmin}
      R2_BUCKET: ${R2_BUCKET:-vantly-ugc}
    ports: ["3003:3000"]

volumes:
  pgdata:
  miniodata:
